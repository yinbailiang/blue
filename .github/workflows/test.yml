name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI 与本地共用同一把质量门：pre-commit 通过才允许跑测试。
jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.14
        run: uv python install 3.14

      # 工作区有 28 个成员，`uv sync --all-packages` 才能让 services/ 下的测试
      # 导入到各自的包（单包项目用 --extra dev 即可，这里不行）。
      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  test:
    name: test (${{ matrix.os }})
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 只写 3.14：requires-python >= 3.14，下界即唯一版本。
        # 不含 windows：控制面用 fcntl.flock 做跨进程锁，Windows 无此模块。
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-packages

      # browser / browser_ops / terminal 里有一批用例自带 skipif：缺 firefox、
      # geckodriver、nvim 就静默跳过。本地这样很合理（不是人人装了浏览器），
      # 但 CI 上「全绿」里会有一大块其实是「什么都没测」。所以这里装上，
      # 并且下面用一步「缺件即失败」把静默跳过堵死。
      - name: 安装 Firefox（browser / browser_ops）
        if: matrix.os == 'ubuntu-latest'
        uses: browser-actions/setup-firefox@v1

      - name: 安装 geckodriver（browser_ops）
        if: matrix.os == 'ubuntu-latest'
        uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 neovim（terminal 的 E1568 端到端用例）
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends neovim

      - name: 确认集成依赖已就位
        if: matrix.os == 'ubuntu-latest'
        run: |
          missing=0
          for bin in firefox geckodriver nvim; do
            if path=$(command -v "$bin"); then
              echo "OK   $bin -> $path"
            else
              echo "MISS $bin"
              missing=1
            fi
          done
          exit "$missing"

      # 覆盖率门槛只在 Linux 上强制：macOS 有若干仅在 POSIX/Linux 才走到的分支
      # （control/process.py 的信号路径、control/state.py 的锁等待），实测 82% vs 83%。
      # 两边都出报告，只有 Linux 用 --cov-fail-under 卡门。
      #
      # -n 2：GitHub runner 只有 2–4 核，pyproject 的默认 -n 8 在这里会过载
      # （还会让 test_activation 那类墙钟敏感的用例抖）。-m "" 覆盖默认的
      # 「排除 slow」——CI 要跑全量，包括真起 firefox/geckodriver 的集成用例；
      # 环境里没有二进制的用例自带 skipif，会自己跳过。
      - name: Run tests with coverage (gate)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run pytest -n 2 -m "not integration" \
            --cov=blue --cov-report=term-missing --cov-fail-under=83 -v

      - name: Run tests with coverage (report only)
        if: matrix.os != 'ubuntu-latest'
        run: |
          uv run pytest -n 2 -m "not integration" --cov=blue --cov-report=term-missing -v

  integration:
    name: integration (RabbitMQ)
    needs: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      # 用默认 vhost "/"：guest 只能访问它（仓库默认是 /blue）。
      BLUE_RABBIT_URL: amqp://guest:guest@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-packages

      - name: 跨进程 fanout 往返
        run: uv run pytest -n 0 -m integration -q
