[project]
name = "blue"
version = "0.1.0"
description = "分布式 Agent 系统的控制面与共享 SDK"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = [
    "infinity-agent>=0.3.0",
    "infinity-agent-kit>=1.0.0",
    "infinity-bus[templates]>=6.2.0",
    "infinity-data[tool]>=3.3.0",
]

[project.scripts]
blue = "blue.cli:main"

[project.optional-dependencies]
# 家族规范（.agents/SKILLS/init-project.md）：CI 跑 `--cov` 靠这个 extra。
# 工作区日常开发走下面的 dev 组（`uv sync --all-packages` 默认就装）。
test = [
    "pytest>=9.2.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue"
module-root = "src"
source-include = ["py.typed"]

[tool.uv.workspace]
members = ["contracts/*", "sdk/*", "services/*"]

[tool.uv.sources]
blue-contracts-session = { workspace = true }
blue-contracts-tool = { workspace = true }
blue-tool-sdk = { workspace = true }

[dependency-groups]
dev = [
    "blue-contracts-session",
    "blue-contracts-tool",
    "blue-tool-sdk",
    "httpx>=0.28.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "pre-commit",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "sdk/tool/src", "services", "tests", "mcp_servers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 源码注释与 docstring 使用中文全角标点，关闭易混淆字符告警
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "sdk", "services", "tests", "mcp_servers"]
extraPaths = [
    "src",
    "sdk/tool/src",
    "contracts/tool/src",
    "contracts/session/src",
    "services/agent/src",
    "services/browser/src",
    "services/browser_ops/src",
    "services/bus/src",
    "services/chat/src",
    "services/clock/src",
    "services/edit_file/src",
    "services/echo/src",
    "services/history_read/src",
    "services/history_search/src",
    "services/inspect/src",
    "services/mcp_bridge/src",
    "services/mcp_server/src",
    "services/read_file/src",
    "services/registry/src",
    "services/session/src",
    "services/shell/src",
    "services/terminal/src",
    "services/text_stats/src",
    "services/view_image/src",
    "services/weather/src",
    "services/web_search/src",
    "services/webui/src",
    "services/write_file/src",
]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
pythonpath = ["src", "sdk/tool/src", "."]
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]
# 默认并行：882 个用例里绝大多数是进程内总线 + 临时目录，天然可并行，
# 串行跑纯属浪费（实测 116s → 19s）。调试单个用例时用 `-n 0` 覆盖，
# 免得 pdb 断在 worker 子进程里看不到。
# 同时默认排除两类：
# - `slow`：6 个用例真起 firefox / geckodriver，并行时互相抢资源（单个从 2.5s
#   涨到 11s），是唯一拖住关键路径的瓶颈。
# - `integration`：要连**真实** RabbitMQ。默认 URL 指向本地 `/blue` vhost，也就是
#   正在跑的生产环境——跑一次就建三个成员队列（durable + 非 auto-delete），
#   一分钟各堆约 2700 条，直到 expires(30min) 才消失。本地默认永不触碰。
# 全量跑用 `-m ""` 覆盖（CI 矩阵就是这么干的），真连 broker 的留给 `-m integration`。
addopts = "-n 8 -m 'not slow and not integration'"
markers = [
    "slow: 依赖真实外部环境（浏览器 / geckodriver / PTY / 真实子进程）的集成测试；日常用 -m 'not slow' 跳过",
    "integration: 需要可达的 RabbitMQ（会在 broker 上建成员队列）；只在隔离环境用 -m integration 显式启用",
]

[tool.interrogate]
# 文档覆盖率是**整包**属性：不能按 staged 文件子集算（单看几个文件会掉到 74%）。
# pre-commit 的 interrogate 钩子已改成 `pass_filenames: false` + 固定路径。
fail-under = 90
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
exclude = ["tests"]
