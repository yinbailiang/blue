[project]
name = "blue"
version = "0.1.0"
description = "分布式 Agent 系统的控制面与共享 SDK"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "blue-contracts-tool",
    "infinity-agent>=0.3.0",
    "infinity-agent-kit>=1.0.0",
    "infinity-bus[templates]>=6.0.0",
    "infinity-data[tool]>=3.3.0",
]

[project.scripts]
blue = "blue.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue"
module-root = "src"
source-include = ["py.typed"]

[tool.uv.workspace]
members = ["contracts/*", "services/*"]

[tool.uv.sources]
blue-contracts-session = { workspace = true }
blue-contracts-tool = { workspace = true }

[dependency-groups]
dev = [
    "blue-contracts-session",
    "httpx>=0.28.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "pre-commit",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "services", "tests", "mcp_servers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 源码注释与 docstring 使用中文全角标点，关闭易混淆字符告警
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "services", "tests", "mcp_servers"]
extraPaths = [
    "src",
    "contracts/tool/src",
    "contracts/session/src",
    "services/agent/src",
    "services/browser/src",
    "services/browser_ops/src",
    "services/bus/src",
    "services/chat/src",
    "services/clock/src",
    "services/edit_file/src",
    "services/echo/src",
    "services/history_read/src",
    "services/history_search/src",
    "services/inspect/src",
    "services/mcp_bridge/src",
    "services/mcp_server/src",
    "services/read_file/src",
    "services/registry/src",
    "services/session/src",
    "services/shell/src",
    "services/terminal/src",
    "services/text_stats/src",
    "services/view_image/src",
    "services/weather/src",
    "services/web_search/src",
    "services/webui/src",
    "services/write_file/src",
]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests", "services"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]
