[project]
name = "blue-service-inspect"
version = "0.1.0"
description = "blue catalog and session inspector"
requires-python = ">=3.14"
dependencies = ["blue", "infinity-bus[templates]>=6.0.0"]

[tool.uv.sources]
blue = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_service_inspect"
module-root = "src"

[project.scripts]
blue-service-inspect = "blue_service_inspect:main"
