[project]
name = "blue-service-view-image"
version = "0.1.0"
description = "blue 外置工具：查看本地图片（返回图片附件）"
requires-python = ">=3.14"
dependencies = [
    "blue",
    "blue-tool-sdk",
    "pillow>=11",
    "pydantic>=2",
]

[tool.uv.sources]
blue = { workspace = true }
blue-tool-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_service_view_image"
module-root = "src"

[project.scripts]
blue-service-view-image = "blue_service_view_image:main"
