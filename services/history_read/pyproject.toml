[project]
name = "blue-service-history_read"
version = "0.1.0"
description = "blue history_read tool service"
requires-python = ">=3.14"
dependencies = ["blue", "pydantic>=2"]

[tool.uv.sources]
blue = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_service_history_read"
module-root = "src"

[project.scripts]
blue-service-history_read = "blue_service_history_read:main"
