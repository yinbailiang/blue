[project]
name = "blue-service-browser-ops"
version = "0.1.0"
description = "blue 外置工具：可交互的浏览器（WebDriver/geckodriver）"
requires-python = ">=3.14"
dependencies = [
    "blue",
    "blue-tool-sdk",
    "httpx>=0.28",
    "pillow>=11",
    "pydantic>=2",
]

[tool.uv.sources]
blue = { workspace = true }
blue-tool-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_service_browser_ops"
module-root = "src"

[project.scripts]
blue-service-browser-ops = "blue_service_browser_ops:main"
