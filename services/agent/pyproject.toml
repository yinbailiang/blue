[project]
name = "blue-service-agent"
version = "0.1.0"
description = "blue agent runtime service"
requires-python = ">=3.14"
dependencies = [
    "blue",
    "blue-contracts-session",
    "blue-contracts-tool",
    "infinity-agent>=0.2.1",
    "infinity-bus[templates]>=6.0.0",
    "pydantic>=2",
]

[tool.uv.sources]
blue = { workspace = true }
blue-contracts-session = { workspace = true }
blue-contracts-tool = { workspace = true }
blue-service-registry = { workspace = true }

[dependency-groups]
dev = ["blue-service-registry"]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_service_agent"
module-root = "src"

[project.scripts]
blue-service-agent = "blue_service_agent:main"
