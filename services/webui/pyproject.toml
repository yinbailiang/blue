[project]
name = "blue-service-webui"
version = "0.4.0"
description = "blue agent FastAPI WebUI"
requires-python = ">=3.14"
dependencies = [
    "blue",
    "blue-contracts-session",
    "blue-contracts-tool",
    "fastapi>=0.115.0",
    "infinity-agent>=0.3.0",
    "infinity-bus[templates]>=6.0.0",
    "pydantic>=2",
    "uvicorn>=0.30.0",
    "websockets>=14.0",
]

[tool.uv.sources]
blue = { workspace = true }
blue-contracts-session = { workspace = true }
blue-contracts-tool = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_service_webui"
module-root = "src"
source-include = ["py.typed", "web/**"]

[project.scripts]
blue-service-webui = "blue_service_webui:main"
