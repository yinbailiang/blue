[project]
name = "blue-service-session"
version = "0.1.0"
description = "blue session persistence service (aiosqlite + WAL)"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.0",
    "blue",
    "blue-contracts-session",
    "infinity-agent>=0.3.0",
    "infinity-bus[templates]>=6.0.0",
    "pydantic>=2",
]

[tool.uv.sources]
blue = { workspace = true }
blue-contracts-session = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_service_session"
module-root = "src"

[project.scripts]
blue-service-session = "blue_service_session:main"
