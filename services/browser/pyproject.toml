[project]
name = "blue-service-browser"
version = "0.1.0"
description = "blue 外置工具：无头浏览器截图（返回图片附件）"
requires-python = ">=3.14"
dependencies = [
    "blue",
    "pillow>=11",
    "pydantic>=2",
]

[tool.uv.sources]
blue = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_service_browser"
module-root = "src"

[project.scripts]
blue-service-browser = "blue_service_browser:main"
