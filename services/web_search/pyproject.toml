[project]
name = "blue-service-web-search"
version = "0.1.0"
description = "blue 搜索引擎工具服务（Bing HTML 结果页）"
requires-python = ">=3.14"
dependencies = ["blue", "blue-tool-sdk", "httpx>=0.28.0", "pydantic>=2"]

[tool.uv.sources]
blue = { workspace = true }
blue-tool-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_service_web_search"
module-root = "src"

[project.scripts]
blue-service-web-search = "blue_service_web_search:main"
