[project]
name = "blue-service-shell"
version = "0.1.0"
description = "blue shell tool service"
requires-python = ">=3.14"
dependencies = ["blue", "blue-tool-sdk", "pydantic>=2"]

[tool.uv.sources]
blue = { workspace = true }
blue-tool-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_service_shell"
module-root = "src"

[project.scripts]
blue-service-shell = "blue_service_shell:main"
