[project]
name = "blue-service-edit-file"
version = "0.1.0"
description = "blue edit_file tool service"
requires-python = ">=3.14"
dependencies = ["blue", "pydantic>=2"]

[tool.uv.sources]
blue = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_service_edit_file"
module-root = "src"

[project.scripts]
blue-service-edit-file = "blue_service_edit_file:main"
