# blue 本地密钥库模板。
#
# 复制为 secrets.toml 后填入真实值（secrets.toml 已被 .gitignore 忽略）：
#
#   cp secrets.example.toml secrets.toml
#   chmod 600 secrets.toml
#
# `blue.infd` 通过 `!file p"secrets.toml"` 导入本文件。文件缺失、或某个键
# 缺失时，对应配置解析为 null（noexist），不会静默变成空字符串——需要密钥的
# 服务会在启动时给出明确提示。
#
# 若不想用 TOML，可改用 secrets.json：把 blue.infd 里的导入改成
# `!file p"secrets.json" as json import ...` 即可。

[agent]
# 模型访问密钥（DeepSeek / OpenAI）
api_key = "sk-..."

[bus]
# RabbitMQ 密码。
# 留空且 user = "guest" 时回退到 RabbitMQ 默认密码 "guest"；
# 非 guest 用户留空会在启动时报错。
password = ""
