[project]
name = "blue-contracts-session"
version = "0.3.0"
description = "blue 会话领域的事件契约"
requires-python = ">=3.14"
dependencies = [
    "infinity-bus[templates]>=6.0.0",
    "pydantic>=2",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_contracts_session"
module-root = "src"
source-include = ["py.typed"]
