[project]
name = "blue-tool-sdk"
version = "0.1.0"
description = "blue 工具运行时：工具进程、注册租约与调用上下文"
requires-python = ">=3.14"
dependencies = [
    "blue",
    "blue-contracts-tool",
    "infinity-agent>=0.3.0",
    "infinity-bus[templates]>=6.0.0",
]

[tool.uv.sources]
blue = { workspace = true }
blue-contracts-tool = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blue_tool_sdk"
module-root = "src"
source-include = ["py.typed"]
